name: Crawl and Push

on:
  workflow_call:
    inputs:
      year:
        description: "學年（民國年）"
        required: true
        type: string
        default: "114"
      term:
        description: "學期（1=上學期, 2=下學期, 3=暑期）"
        required: true
        type: string
        default: "2"
  workflow_dispatch:
    inputs:
      year:
        description: "學年（民國年）"
        required: false
        default: "114"
      term:
        description: "學期（1=上學期, 2=下學期, 3=暑期）"
        required: false
        default: "2"

jobs:
  crawl-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install crawler dependencies
        working-directory: crawler
        run: uv sync

      - name: Run crawler
        working-directory: crawler
        run: |
          YEAR=${{ inputs.year || github.event.inputs.year || '114' }}
          TERM=${{ inputs.term || github.event.inputs.term || '2' }}
          echo "📥 抓取 ${YEAR}-${TERM} 課程資料"
          uv run main.py --year $YEAR --term $TERM

      - name: Generate Sitemap
        working-directory: crawler
        run: |
          YEAR=${{ inputs.year || github.event.inputs.year || '114' }}
          TERM=${{ inputs.term || github.event.inputs.term || '2' }}
          echo "🗺️ 生成 Sitemap.xml"
          uv run generate_sitemap.py --year $YEAR --term $TERM

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit and push data
        run: |
          YEAR=${{ inputs.year || github.event.inputs.year || '114' }}
          TERM=${{ inputs.term || github.event.inputs.term || '2' }}
          echo "📤 提交 ${YEAR}-${TERM} 課程資料到 GitHub"
          git add crawler/original_data/*
          git add public/*
          git commit -m "🍱 Update course data for ${YEAR}-${TERM}"
          git pull origin main --rebase
          git push origin main

      - name: Notify success
        run: echo "🎉 每週課程資料更新成功！"
